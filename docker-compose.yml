services:
  postgres:
    image: postgres:16-alpine
    container_name: productpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-productpulse_db}
      POSTGRES_USER: ${POSTGRES_USER:-productpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_locally}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - productpulse_pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-productpulse} -d ${POSTGRES_DB:-productpulse_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  productpulse_pgdata:
